name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repository quality gate
        run: python portfolio_quality/quality_gate.py .

      - name: Python syntax check
        run: python -m compileall -q agent_service evaluation portfolio_quality tests

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Multi-language benchmark suite
        run: python evaluation/run_benchmarks.py
